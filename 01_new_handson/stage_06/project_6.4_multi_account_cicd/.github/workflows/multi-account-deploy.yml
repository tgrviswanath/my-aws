name: Multi-Account Deployment Pipeline

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, prod]

env:
  AWS_REGION:       us-east-1
  ECR_REPOSITORY:   handson-flask-api
  CONTAINER_NAME:   flask-api

permissions:
  id-token: write
  contents: read

jobs:

  # ─── Build once, deploy everywhere ─────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (management account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.MGMT_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR (management account)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Dev (auto on develop branch) ─────────────────────────────────
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'dev')
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (management account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.MGMT_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume Dev account role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true   # chain from management account role

      - name: Deploy to Dev ECS
        run: |
          aws ecs update-service \
            --cluster handson-dev-cluster \
            --service handson-flask-api-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

          aws ecs wait services-stable \
            --cluster handson-dev-cluster \
            --services handson-flask-api-service

          echo "✅ Deployed to Dev: ${{ github.sha }}"

  # ─── Deploy to Staging (auto on main branch) ────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, deploy-dev]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'staging')
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (management account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.MGMT_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume Staging account role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true

      - name: Deploy to Staging ECS
        run: |
          aws ecs update-service \
            --cluster handson-staging-cluster \
            --service handson-flask-api-service \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster handson-staging-cluster \
            --services handson-flask-api-service

          echo "✅ Deployed to Staging: ${{ github.sha }}"

  # ─── Deploy to Prod (manual approval required) ──────────────────────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'prod')
    environment: production   # requires manual approval in GitHub Environments

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (management account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.MGMT_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume Prod account role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true

      - name: Deploy to Production ECS
        run: |
          aws ecs update-service \
            --cluster handson-prod-cluster \
            --service handson-flask-api-service \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster handson-prod-cluster \
            --services handson-flask-api-service

          echo "✅ Deployed to Production: ${{ github.sha }}"
