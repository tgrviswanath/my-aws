apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-api-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # clean up on delete
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_ORG/YOUR_REPO
    targetRevision: HEAD
    path: k8s/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true       # delete resources removed from Git
      selfHeal: true    # fix manual changes automatically
    syncOptions:
      - CreateNamespace=true   # create namespace if it doesn't exist
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-api-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_ORG/YOUR_REPO
    targetRevision: HEAD
    path: k8s/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    # prod: manual sync only — no auto-deploy
    syncOptions:
      - CreateNamespace=true
