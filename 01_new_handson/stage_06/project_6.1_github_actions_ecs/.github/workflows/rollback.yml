name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Git SHA to roll back to (e.g. abc1234)"
        required: true
        type: string
      reason:
        description: "Reason for rollback"
        required: true
        type: string

env:
  AWS_REGION:     us-east-1
  ECR_REPOSITORY: handson-flask-api
  ECS_CLUSTER:    handson-cluster
  ECS_SERVICE:    handson-flask-api-service
  CONTAINER_NAME: flask-api

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    name: Rollback to ${{ inputs.git_sha }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify rollback image exists in ECR
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.git_sha }}"
          echo "Rolling back to: $IMAGE"
          aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=${{ inputs.git_sha }} \
            || (echo "❌ Image not found in ECR: ${{ inputs.git_sha }}" && exit 1)

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --query taskDefinition > task-definition.json

      - name: Update task definition with rollback image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.git_sha }}

      - name: Deploy rollback
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Rollback summary
        run: |
          echo "## ⏪ Rollback Complete" >> $GITHUB_STEP_SUMMARY
          echo "Rolled back to: \`${{ inputs.git_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Reason: ${{ inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
